project:
  type: website
  # Rendered site is committed to docs/ and served by GitHub Pages
  # (Settings → Pages → Deploy from a branch → main → /docs).
  output-dir: docs
  resources:
    - assets/**
    - .nojekyll

website:
  title: "Phuong Luong"
  description: "GIS analyst working in remote sensing, land cover mapping, spatial analysis and geospatial reference data."
  site-url: "https://phuongluong2086.github.io"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  # Navigation is a hand-written partial (_includes/nav.html) rather than the
  # Quarto navbar, because `theme: none` means Bootstrap is not loaded and the
  # built-in navbar would not render.

format:
  html:
    theme: none
    css: styles.css
    toc: false
    page-layout: full
    title-block-style: none
    anchor-sections: false
    include-in-header: _includes/head.html
    include-before-body: _includes/nav.html
    include-after-body: _includes/footer.html
